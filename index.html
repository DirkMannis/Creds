<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paused | back soon · Tip a Random Grok User</title>
<meta name="description" content="The Tip a Random Grok User play-money beta is paused. Back soon.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
:root{--bg:#0a0c11;--panel:#131722;--line:#262d40;--txt:#e9edf6;--mut:#8b94aa;--acc:#7c9cff;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 70% -10%,#1b2340 0%,var(--bg) 55%) fixed;color:var(--txt);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:460px;width:100%;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:36px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{font-size:34px;width:60px;height:60px;margin:0 auto 18px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#2a3560,#151a2a);border:1px solid var(--line)}
.pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:linear-gradient(135deg,#6f8dff,#9b6dff);color:#fff}
h1{font-size:26px;margin:14px 0 6px;letter-spacing:-.01em}
p{color:var(--mut);margin:0}
</style>
</head>
<body>
<main class="card">
  <div class="logo">🎲</div>
  <span class="pill">Paused</span>
  <h1>Paused | back soon</h1>
  <p>Tip a Random Grok User is taking a short break. The boards will be back next week.</p>
</main>
</body>
</html>
